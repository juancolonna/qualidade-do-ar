name: Update PM2.5 Dashboard

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - privacy.html
      - manifest.json
      - OneSignalSDKWorker.js
      - style.css
      - .github/workflows/update.yml

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site/icons
          cp index.html privacy.html style.css manifest.json OneSignalSDKWorker.js _site/
          cp icons/icon-192.png icons/icon-512.png icons/icon-256.png _site/icons/

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
