<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PM2.5 — Manaus</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            text-align: center;
        }

        .main {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .value {
            font-size: 56px;
            font-weight: bold;
        }

        .unit {
            font-size: 20px;
        }

        .info {
            margin-top: 15px;
            color: #555;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 25px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .online {
            color: green;
            font-weight: bold;
        }

        .offline {
            color: red;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <h1>PM2.5 — Manaus</h1>


    <div class="main">

        <div class="value" id="mean">
            --
        </div>

        <div class="unit">
            µg/m³
        </div>

        <div class="info">
            Média dos sensores online
        </div>


        <div class="stats">

            <div class="stat">

                <div class="stat-value" id="std">
                    --
                </div>

                <div>
                    Desvio padrão
                </div>

            </div>


            <div class="stat">

                <div class="stat-value" id="online">
                    --
                </div>

                <div>
                    Sensores online
                </div>

            </div>

        </div>


        <div class="info">

            Período analisado:
            <strong id="last-reading">--</strong>
            (Manaus, UTC−4)
        </div>


        <div class="info">

            Última atualização do dashboard:
            <strong id="updated">--</strong>
            (Manaus, UTC−4)
        </div>

    </div>


    <h2>Sensores</h2>


    <table>

        <thead>

            <tr>

                <th>Sensor</th>
                <th>Status</th>
                <th>PM2.5 (µg/m³)</th>

            </tr>

        </thead>

        <tbody id="sensor-table">

        </tbody>

    </table>


    <script>

        async function loadData() {

            try {

                // Evita cache do navegador
                const response = await fetch(
                    "data.json?t=" + Date.now()
                );

                const data = await response.json();


                // Estatísticas
                document.getElementById("mean").textContent =
                    data.pm2_5_mean !== null
                        ? data.pm2_5_mean.toFixed(2)
                        : "--";


                document.getElementById("std").textContent =
                    data.pm2_5_std !== null
                        ? data.pm2_5_std.toFixed(2)
                        : "--";


                document.getElementById("online").textContent =
                    data.number_online;


                document.getElementById("last-reading").textContent =
                    data.last_reading || "--";


                document.getElementById("updated").textContent =
                    data.updated_at;


                // Tabela
                const table =
                    document.getElementById("sensor-table");

                table.innerHTML = "";


                data.sensors.forEach(sensor => {

                    const row = document.createElement("tr");

                    const status = sensor.online
                        ? "ONLINE"
                        : "OFFLINE";

                    const statusClass = sensor.online
                        ? "online"
                        : "offline";


                    const pm25 =
                        sensor.pm2_5 !== null
                            ? sensor.pm2_5.toFixed(2)
                            : "--";


                    row.innerHTML = `
                        <td>${sensor.name}</td>

                        <td class="${statusClass}">
                            ${status}
                        </td>

                        <td>${pm25}</td>
                    `;


                    table.appendChild(row);

                });

            }

            catch (error) {

                console.error(
                    "Erro ao carregar dados:",
                    error
                );

            }

        }


        // Carrega imediatamente
        loadData();

    </script>

</body>

</html>
