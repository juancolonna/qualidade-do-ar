<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Qualidade do Ar - Manaus</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .info {
            margin-bottom: 25px;
            color: #555;
            line-height: 1.8;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            min-width: 180px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .pm25-green { background: #90ee90; }
        .pm25-yellow { background: #ffff00; }
        .pm25-orange { background: #ffa500; }
        .pm25-red { background: #ff0000; }
        .pm25-violet { background: #8b00ff; }

        .ci-value { font-weight: normal; }
        .mean-value { font-weight: bold; }
        .unit { font-weight: normal; }

        .legend {
            margin-top: 8px;
            font-size: 11px;
            color: #666;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .legend-color {
            width: 9px;
            height: 9px;
            border-radius: 2px;
            display: inline-block;
        }

        #map {
            height: 500px;
            width: 100%;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .map-popup {
            line-height: 1.5;
        }

        .map-marker {
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }

        .card h3 {
            margin-top: 0;
            font-size: 15px;
            color: #666;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee;
        }

        .online {
            color: green;
            font-weight: bold;
        }

        .offline {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Qualidade do Ar - Manaus</h1>

    <div class="subtitle">
        Monitoramento de PM2.5
    </div>

    <div class="info">

        <div>
            <strong>Período analisado:</strong>
            <span id="period">--</span>
        </div>

        <div>
            <strong>Dashboard atualizado:</strong>
            <span id="updated">--</span>
        </div>

    </div>


    <div class="cards">

        <div class="card" id="mean-card">
            <h3>PM2.5 médio (IC 95%)</h3>

            <div class="value">
                <span id="ci95">--</span> <span class="unit">µg/m³</span>
            </div>

            <div class="legend">
                <span class="legend-item"><span class="legend-color pm25-green"></span>0–25 bom</span>
                <span class="legend-item"><span class="legend-color pm25-yellow"></span>25–50 moderado</span>
                <span class="legend-item"><span class="legend-color pm25-orange"></span>50–75 ruim</span>
                <span class="legend-item"><span class="legend-color pm25-red"></span>75–125 muito ruim</span>
                <span class="legend-item"><span class="legend-color pm25-violet"></span>&gt;125 péssimo</span>
            </div>
        </div>
    </div>


    <h2>Mapa dos sensores</h2>

    <div id="map"></div>


    <h2>Sensores</h2>


    <table>

        <thead>

            <tr>
                <th>Sensor</th>
                <th>Status</th>
                <th>PM2.5 (µg/m³)</th>
            </tr>

        </thead>


        <tbody id="sensor-table">

        </tbody>

    </table>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        const map = L.map("map").setView([-3.10, -60.02], 12);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        function getPM25Color(pm25) {
            if (pm25 === null || isNaN(pm25)) return "#808080";
            if (pm25 < 25) return "#008000";
            if (pm25 < 50) return "#ffff00";
            if (pm25 < 75) return "#ffa500";
            if (pm25 < 125) return "#ff0000";
            return "#8b00ff";
        }

        async function loadData() {

            try {

                /*
                 * O data.json é gerado pelo collect.py.
                 *
                 * period_start, period_end e updated_at
                 * já estão formatados em horário de Manaus.
                 *
                 * Portanto, NÃO fazemos nenhuma conversão
                 * de timezone aqui.
                 */

                const response = await fetch(
                    "data.json?t=" + Date.now()
                );

                if (!response.ok) {
                    throw new Error(
                        "Não foi possível carregar data.json"
                    );
                }

                const data = await response.json();


                /*
                 * Período analisado
                 */

                document.getElementById("period").textContent =
                    data.period_start + " – " + data.period_end;


                /*
                 * Horário de atualização
                 */

                document.getElementById("updated").textContent =
                    data.updated_at;


                /*
                 * Estatísticas
                 */

                const meanCard = document.getElementById("mean-card");
                const mean = Number(data.pm2_5_mean);

                meanCard.classList.remove(
                    "pm25-green",
                    "pm25-yellow",
                    "pm25-orange",
                    "pm25-red",
                    "pm25-violet"
                );

                if (!isNaN(mean)) {
                    if (mean < 25) {
                        meanCard.classList.add("pm25-green");
                    } else if (mean < 50) {
                        meanCard.classList.add("pm25-yellow");
                    } else if (mean < 75) {
                        meanCard.classList.add("pm25-orange");
                    } else if (mean < 125) {
                        meanCard.classList.add("pm25-red");
                    } else {
                        meanCard.classList.add("pm25-violet");
                    }
                }


                document.getElementById("ci95").innerHTML =
                    data.pm2_5_ci95_lower !== null &&
                    data.pm2_5_mean !== null &&
                    data.pm2_5_ci95_upper !== null
                        ? '<span class="ci-value">' + Number(data.pm2_5_ci95_lower).toFixed(1) +
                          ' ≤ </span><span class="mean-value">' + Number(data.pm2_5_mean).toFixed(1) +
                          '</span><span class="ci-value"> ≤ ' + Number(data.pm2_5_ci95_upper).toFixed(1) + '</span>'
                        : "--";


                /*
                 * Mapa dos sensores
                 */

                const sensorPoints = [];

                data.sensors.forEach(sensor => {
                    if (sensor.lat === null || sensor.lon === null) return;

                    const lat = Number(sensor.lat);
                    const lon = Number(sensor.lon);
                    if (isNaN(lat) || isNaN(lon)) return;

                    sensorPoints.push([lat, lon]);

                    const pm25 = sensor.pm2_5 !== null
                        ? Number(sensor.pm2_5)
                        : null;

                    const marker = L.circleMarker([lat, lon], {
                        radius: 9,
                        color: "white",
                        weight: 2,
                        fillColor: getPM25Color(pm25),
                        fillOpacity: 0.9
                    }).addTo(map);

                    const value = pm25 !== null && !isNaN(pm25)
                        ? pm25.toFixed(1) + " µg/m³"
                        : "--";

                    marker.bindPopup(
                        '<div class="map-popup"><strong>' + sensor.name +
                        '</strong><br>PM2.5: ' + value +
                        '<br>Status: ' + (sensor.online ? "Online" : "Offline") +
                        '</div>'
                    );
                });

                if (sensorPoints.length > 0) {
                    map.fitBounds(sensorPoints, { padding: [30, 30] });
                }


                /*
                 * Tabela dos sensores
                 */

                const table =
                    document.getElementById("sensor-table");

                table.innerHTML = "";


                data.sensors.forEach(sensor => {

                    const row =
                        document.createElement("tr");


                    const status =
                        sensor.online
                            ? '<span class="online">Online</span>'
                            : '<span class="offline">Offline</span>';


                    const pm25 =
                        sensor.pm2_5 !== null
                            ? Number(sensor.pm2_5).toFixed(1)
                            : "--";


                    row.innerHTML = `
                        <td>${sensor.name}</td>
                        <td>${status}</td>
                        <td>${pm25}</td>
                    `;


                    table.appendChild(row);

                });

            }

            catch (error) {

                console.error(
                    "Erro ao carregar dados:",
                    error
                );

            }

        }


        /*
         * Carrega os dados quando a página abre.
         */

        loadData();

    </script>

</body>

</html>
