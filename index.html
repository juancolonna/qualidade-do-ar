<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Qualidade do Ar - Manaus</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .info {
            margin-bottom: 25px;
            color: #555;
            line-height: 1.8;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            min-width: 180px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-top: 0;
            font-size: 15px;
            color: #666;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee;
        }

        .online {
            color: green;
            font-weight: bold;
        }

        .offline {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Qualidade do Ar - Manaus</h1>

    <div class="subtitle">
        Monitoramento de PM2.5
    </div>

    <div class="info">

        <div>
            <strong>Período analisado:</strong>
            <span id="period">--</span>
        </div>

        <div>
            <strong>Dashboard atualizado:</strong>
            <span id="updated">--</span>
        </div>

    </div>


    <div class="cards">

        <div class="card">
            <h3>PM2.5 médio</h3>

            <div class="value">
                <span id="mean">--</span> µg/m³
            </div>
        </div>


        <div class="card">
            <h3>IC 95%</h3>

            <div class="value">
                <span id="ci95">--</span> µg/m³
            </div>
        </div>
    </div>


    <h2>Sensores</h2>


    <table>

        <thead>

            <tr>
                <th>Sensor</th>
                <th>Status</th>
                <th>PM2.5 (µg/m³)</th>
            </tr>

        </thead>


        <tbody id="sensor-table">

        </tbody>

    </table>


    <script>

        async function loadData() {

            try {

                /*
                 * O data.json é gerado pelo collect.py.
                 *
                 * period_start, period_end e updated_at
                 * já estão formatados em horário de Manaus.
                 *
                 * Portanto, NÃO fazemos nenhuma conversão
                 * de timezone aqui.
                 */

                const response = await fetch(
                    "data.json?t=" + Date.now()
                );

                if (!response.ok) {
                    throw new Error(
                        "Não foi possível carregar data.json"
                    );
                }

                const data = await response.json();


                /*
                 * Período analisado
                 */

                document.getElementById("period").textContent =
                    data.period_start + " – " + data.period_end;


                /*
                 * Horário de atualização
                 */

                document.getElementById("updated").textContent =
                    data.updated_at;


                /*
                 * Estatísticas
                 */

                document.getElementById("mean").textContent =
                    data.pm2_5_mean !== null
                        ? Number(data.pm2_5_mean).toFixed(1)
                        : "--";


                document.getElementById("ci95").textContent =
                    data.pm2_5_ci95_lower !== null &&
                    data.pm2_5_ci95_upper !== null
                        ? Number(data.pm2_5_ci95_lower).toFixed(1) +
                          " – " +
                          Number(data.pm2_5_ci95_upper).toFixed(1)
                        : "--";


                /*
                 * Tabela dos sensores
                 */

                const table =
                    document.getElementById("sensor-table");

                table.innerHTML = "";


                data.sensors.forEach(sensor => {

                    const row =
                        document.createElement("tr");


                    const status =
                        sensor.online
                            ? '<span class="online">Online</span>'
                            : '<span class="offline">Offline</span>';


                    const pm25 =
                        sensor.pm2_5 !== null
                            ? Number(sensor.pm2_5).toFixed(1)
                            : "--";


                    row.innerHTML = `
                        <td>${sensor.name}</td>
                        <td>${status}</td>
                        <td>${pm25}</td>
                    `;


                    table.appendChild(row);

                });

            }

            catch (error) {

                console.error(
                    "Erro ao carregar dados:",
                    error
                );

            }

        }


        /*
         * Carrega os dados quando a página abre.
         */

        loadData();

    </script>

</body>

</html>
